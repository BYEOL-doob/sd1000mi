name: Update Naver Blog
on:
  workflow_dispatch:
  schedule:
    - cron: '10 21 * * *' # 매일 06:10 KST
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run import:naver
      - name: Commit updated posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts.json assets/blog
          git diff --cached --quiet || git commit -m "Update Naver blog content"
          git push
